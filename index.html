<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>動態貼圖製作</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 使用 CDN 引入 gif.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F3F4F6;
            /* 避免下拉重新整理干擾 */
            overscroll-behavior-y: none; 
            user-select: none;
        }

        .frame-card {
            transition: all 0.2s;
            min-width: 140px;
        }

        .frame-card.active {
            border-color: #EF4444;
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.3);
        }

        .action-btn:active {
            transform: scale(0.95);
            transition: transform 0.1s;
        }

        /* 自訂橫向捲軸樣式 */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }

        #loadingOverlay {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }

        /* 確保畫布不會因為預設手勢而滑動頁面 */
        #canvasBox {
            touch-action: none;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col m-0 p-0 overflow-hidden">

    <!-- Header (橫跨頂部) -->
    <header class="bg-red-500 text-white px-4 py-3 flex justify-between items-center shrink-0 shadow-md z-10">
        <h1 class="text-xl md:text-2xl font-bold tracking-tight flex items-center gap-2">
            <span>✨</span> 動態貼圖製作
        </h1>
        <button onclick="previewAnimation()" id="previewBtn" class="bg-white text-red-500 px-5 py-2 rounded-full font-bold shadow-md action-btn transition-colors hover:bg-gray-50 flex items-center gap-2">
            <span>▶️</span> <span>預覽播放</span>
        </button>
    </header>

    <!-- 主版面結構：電腦版左右分割，手機版上下堆疊 -->
    <div class="flex flex-col md:flex-row flex-1 overflow-hidden">
        
        <!-- 左半部 (或手機上半部)：畫布與時間軸 -->
        <div class="flex-1 flex flex-col bg-gray-100 overflow-hidden relative">
            
            <!-- 畫布區域 -->
            <div class="flex-1 flex flex-col p-2 md:p-4 overflow-hidden relative">
                <!-- 工具列與提示 -->
                <div class="flex justify-between items-center w-full max-w-2xl mx-auto mb-2 shrink-0">
                    <div class="text-xs md:text-sm text-gray-500 font-medium bg-white px-3 py-1.5 rounded-full shadow-sm">
                        💡 拖移物件，按<span class="text-blue-500 font-bold mx-1">藍圈</span>旋轉縮放
                    </div>
                    <button onclick="openSizeModal()" class="text-xs md:text-sm font-bold text-gray-700 bg-white border border-gray-300 px-4 py-1.5 rounded-full shadow-sm hover:bg-gray-50 flex items-center gap-1 action-btn transition-colors">
                        ⚙️ 尺寸 <span id="canvasSizeDisplay" class="text-blue-600 ml-1">370x320</span>
                    </button>
                </div>

                <!-- 畫布容器 (動態置中與縮放) -->
                <div class="flex-1 w-full flex justify-center items-center overflow-hidden min-h-[200px]">
                    <div id="canvasBox" class="bg-white border-4 border-white rounded-xl shadow-md relative" 
                         style="aspect-ratio: 370/320; max-width: 100%; max-height: 100%; background-image: linear-gradient(45deg, #e5e5e5 25%, transparent 25%), linear-gradient(-45deg, #e5e5e5 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e5e5 75%), linear-gradient(-45deg, transparent 75%, #e5e5e5 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;">
                        <!-- 實際 Canvas 元素完全填滿這個 Box -->
                        <canvas id="mainCanvas" width="370" height="320" class="w-full h-full block absolute top-0 left-0 rounded-lg"></canvas>
                    </div>
                </div>
            </div>

            <!-- Frame Timeline (橫向滑動區塊) -->
            <div class="w-full bg-white border-t border-gray-200 shrink-0 flex flex-col shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <div class="flex justify-between items-center px-4 py-2 border-b border-gray-100">
                    <span class="font-bold text-gray-700">🎬 動畫步驟</span>
                    <button onclick="addFrame()" class="text-blue-600 bg-blue-50 px-3 py-1 rounded-full font-bold text-sm hover:bg-blue-100 transition-colors">+ 新增步驟</button>
                </div>

                <div id="frameList" class="flex overflow-x-auto gap-4 px-4 py-4 custom-scrollbar items-start" style="min-height: 160px;">
                    <!-- Frames 將由 JS 動態產生 -->
                </div>
            </div>
        </div>

        <!-- 右半部 (或手機下半部)：控制面板 -->
        <div class="w-full md:w-[380px] bg-white border-t md:border-t-0 md:border-l border-gray-200 flex flex-col shrink-0 overflow-y-auto custom-scrollbar z-10 shadow-lg md:shadow-none">
            <div class="p-5 flex flex-col gap-4">
                <h2 class="font-bold text-gray-700 hidden md:block mb-2 text-lg">🛠️ 工具面板</h2>
                
                <div id="panel-add" class="flex flex-col gap-3">
                    <!-- 挑選圖片 (使用 label 包裝，解決 iOS 點擊與事件衝突問題) -->
                    <label class="action-btn flex items-center justify-center p-4 bg-green-50 hover:bg-green-100 border-2 border-green-300 rounded-2xl gap-3 transition-colors group cursor-pointer m-0">
                        <span class="text-3xl group-hover:scale-110 transition-transform">🖼️</span>
                        <span class="font-bold text-xl text-green-700">挑選圖片</span>
                        <!-- 將 input 藏在 label 內，不用 onclick 就能觸發選檔 -->
                        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="handleFileUpload(event)">
                    </label>

                    <!-- 第二排：寫文字 + 加小物件 -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="promptAddText()" class="action-btn flex flex-col items-center justify-center p-4 bg-yellow-50 hover:bg-yellow-100 border-2 border-yellow-200 rounded-2xl gap-2 transition-colors">
                            <span class="text-3xl">✍️</span>
                            <span class="font-bold text-gray-700">寫文字</span>
                        </button>
                        <button onclick="openStickerModal()" class="action-btn flex flex-col items-center justify-center p-4 bg-pink-50 hover:bg-pink-100 border-2 border-pink-200 rounded-2xl gap-2 transition-colors">
                            <span class="text-3xl">🎨</span>
                            <span class="font-bold text-gray-700">加小物件</span>
                        </button>
                    </div>

                    <div class="border-t border-gray-100 my-1"></div>

                    <!-- 第三排：翻轉 (物件選中時才啟用) -->
                    <div class="text-sm font-bold text-gray-400 px-1">物件控制</div>
                    <div id="flipBtns" class="grid grid-cols-2 gap-3 opacity-40 pointer-events-none transition-opacity">
                        <button onclick="flipSelected('H')" class="action-btn flex flex-col items-center justify-center p-3 bg-blue-50 border-2 border-blue-200 rounded-xl gap-1 transition-colors">
                            <span class="text-2xl">↔️</span>
                            <span class="font-bold text-sm text-blue-700">水平翻轉</span>
                        </button>
                        <button onclick="flipSelected('V')" class="action-btn flex flex-col items-center justify-center p-3 bg-purple-50 border-2 border-purple-200 rounded-xl gap-1 transition-colors">
                            <span class="text-2xl">↕️</span>
                            <span class="font-bold text-sm text-purple-700">垂直翻轉</span>
                        </button>
                    </div>

                    <!-- 第四排：刪除 -->
                    <button onclick="deleteSelected()" id="deleteBtn" class="action-btn flex items-center justify-center p-3 bg-gray-50 hover:bg-red-50 border-2 border-gray-200 hover:border-red-200 rounded-xl gap-2 opacity-40 transition-colors" disabled>
                        <span class="text-xl">🗑️</span>
                        <span class="font-bold text-gray-600" id="deleteBtnText">刪除選中物件</span>
                    </button>
                </div>

                <div class="mt-4 flex-1 flex flex-col justify-end">
                    <button onclick="exportGIF()" class="w-full py-4 bg-red-500 hover:bg-red-600 text-white rounded-2xl font-bold text-xl shadow-[0_8px_15px_-3px_rgba(239,68,68,0.4)] action-btn transition-all flex justify-center items-center gap-2">
                        <span>💾</span> 製作完成 (存成 GIF)
                    </button>
                    <p class="text-center text-gray-400 mt-4 text-xs font-medium pb-2">
                        Dynamic Sticker Maker @2026
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- =============== Modals (彈出視窗) =============== -->

    <!-- Size Setting Modal -->
    <div id="sizeModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[130] backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-[340px] transform transition-transform">
            <h3 class="text-xl font-bold mb-4 text-center">⚙️ 設定畫布與下載尺寸</h3>
            <div class="flex items-center gap-3 mb-5">
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-500 mb-1 text-center">寬度 (px)</label>
                    <input type="number" id="canvasWidthInput" class="w-full border-2 border-gray-300 focus:border-blue-500 outline-none p-2 rounded-xl text-xl text-center font-bold transition-colors" value="370">
                </div>
                <span class="text-2xl font-bold text-gray-400 mt-5">×</span>
                <div class="flex-1">
                    <label class="block text-sm font-bold text-gray-500 mb-1 text-center">高度 (px)</label>
                    <input type="number" id="canvasHeightInput" class="w-full border-2 border-gray-300 focus:border-blue-500 outline-none p-2 rounded-xl text-xl text-center font-bold transition-colors" value="320">
                </div>
            </div>
            
            <button onclick="useUploadedImageSize()" class="w-full py-3 mb-5 bg-green-50 text-green-700 border-2 border-green-300 hover:bg-green-100 rounded-xl font-bold text-sm flex items-center justify-center gap-2 action-btn transition-colors">
                <span class="text-xl">🖼️</span> 依照上傳圖片的原始尺寸
            </button>

            <div class="flex gap-3">
                <button onclick="closeSizeModal()" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold text-gray-600 action-btn transition-colors">取消</button>
                <button onclick="confirmSizeChange()" class="flex-1 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold action-btn transition-colors">確定更改</button>
            </div>
        </div>
    </div>

    <!-- Sticker Picker Modal -->
    <div id="stickerModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[120] backdrop-blur-sm">
        <div class="bg-white w-full max-w-[400px] rounded-3xl p-6 shadow-2xl">
            <h3 class="text-2xl font-bold mb-4 text-center">選一個小物件 🎉</h3>
            <div class="grid grid-cols-6 gap-2 mb-5" id="stickerGrid"></div>
            <button onclick="closeStickerModal()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold text-gray-600 text-lg action-btn transition-colors">取消</button>
        </div>
    </div>

    <!-- Text Modal -->
    <div id="textModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-[120] backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-5 shadow-2xl w-full max-w-[320px] max-h-[90vh] overflow-y-auto custom-scrollbar">
            <h3 class="text-xl font-bold mb-3 flex items-center gap-2"><span>✍️</span> 寫文字</h3>

            <!-- 多行文字輸入 -->
            <textarea id="textInput" rows="3" class="w-full border-2 border-gray-300 focus:border-blue-500 outline-none p-3 rounded-xl text-xl mb-3 block resize-none transition-colors" placeholder="可輸入多行文字&#10;例如：早安&#10;新的一天"></textarea>

            <!-- 行距 -->
            <div class="flex items-center gap-2 mb-4">
                <span class="text-sm font-bold text-gray-500 whitespace-nowrap">行距</span>
                <div class="flex gap-1 flex-1">
                    <button onclick="setLineHeight(1.0)" id="lh-10" class="flex-1 py-1.5 rounded-lg border-2 border-gray-200 bg-gray-50 font-bold text-gray-600 text-sm">緊</button>
                    <button onclick="setLineHeight(1.4)" id="lh-14" class="flex-1 py-1.5 rounded-lg border-2 border-blue-400 bg-blue-50 font-bold text-blue-600 text-sm">中</button>
                    <button onclick="setLineHeight(1.9)" id="lh-19" class="flex-1 py-1.5 rounded-lg border-2 border-gray-200 bg-gray-50 font-bold text-gray-600 text-sm">寬</button>
                    <button onclick="setLineHeight(2.5)" id="lh-25" class="flex-1 py-1.5 rounded-lg border-2 border-gray-200 bg-gray-50 font-bold text-gray-600 text-sm">超</button>
                </div>
            </div>

            <!-- 文字顏色 -->
            <div class="text-sm font-bold text-gray-500 mb-2 flex items-center justify-between">
                <span>🖊 文字顏色</span>
                <div id="colorPreview" class="w-6 h-6 rounded-full border-2 border-gray-300 shadow-inner" style="background:#EF4444"></div>
            </div>
            <div class="flex flex-wrap gap-2 items-center mb-4 bg-gray-50 p-2 rounded-xl border border-gray-100">
                <button onclick="setTextColor('#EF4444')" class="w-8 h-8 rounded-full bg-red-500 border-2 border-transparent hover:border-gray-400 shadow-sm"></button>
                <button onclick="setTextColor('#3B82F6')" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-transparent hover:border-gray-400 shadow-sm"></button>
                <button onclick="setTextColor('#10B981')" class="w-8 h-8 rounded-full bg-green-500 border-2 border-transparent hover:border-gray-400 shadow-sm"></button>
                <button onclick="setTextColor('#F59E0B')" class="w-8 h-8 rounded-full bg-yellow-500 border-2 border-transparent hover:border-gray-400 shadow-sm"></button>
                <button onclick="setTextColor('#8B5CF6')" class="w-8 h-8 rounded-full bg-purple-500 border-2 border-transparent hover:border-gray-400 shadow-sm"></button>
                <button onclick="setTextColor('#000000')" class="w-8 h-8 rounded-full bg-black border-2 border-transparent hover:border-gray-400 shadow-sm"></button>
                <button onclick="setTextColor('#FFFFFF')" class="w-8 h-8 rounded-full bg-white border-2 border-gray-300 hover:border-gray-400 shadow-sm"></button>
                <label class="w-8 h-8 rounded-full border-2 border-dashed border-gray-400 flex items-center justify-center cursor-pointer relative overflow-hidden shadow-sm hover:bg-gray-200" title="自訂">
                    <span class="text-xs">🎨</span>
                    <input type="color" id="customColorInput" onchange="setTextColor(this.value)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                </label>
            </div>

            <!-- 框線顏色 -->
            <div class="text-sm font-bold text-gray-500 mb-2 flex items-center justify-between">
                <span>🔲 框線顏色</span>
                <div id="strokeColorPreview" class="w-6 h-6 rounded-full border-2 border-gray-300 shadow-inner" style="background:#FFFFFF"></div>
            </div>
            <div class="flex flex-wrap gap-2 items-center mb-4 bg-gray-50 p-2 rounded-xl border border-gray-100">
                <button onclick="setStrokeColor('#FFFFFF')" class="w-8 h-8 rounded-full bg-white border-2 border-gray-300 shadow-sm hover:border-gray-400"></button>
                <button onclick="setStrokeColor('#000000')" class="w-8 h-8 rounded-full bg-black border-2 border-transparent shadow-sm hover:border-gray-400"></button>
                <button onclick="setStrokeColor('#EF4444')" class="w-8 h-8 rounded-full bg-red-500 border-2 border-transparent shadow-sm hover:border-gray-400"></button>
                <button onclick="setStrokeColor('#3B82F6')" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-transparent shadow-sm hover:border-gray-400"></button>
                <button onclick="setStrokeColor('#F59E0B')" class="w-8 h-8 rounded-full bg-yellow-500 border-2 border-transparent shadow-sm hover:border-gray-400"></button>
                <button onclick="setStrokeColor('none')" class="w-8 h-8 rounded-full border-2 border-dashed border-gray-400 flex items-center justify-center shadow-sm bg-gray-100 font-bold text-gray-500 text-xs hover:bg-gray-200" title="無框線">✕</button>
                <label class="w-8 h-8 rounded-full border-2 border-dashed border-blue-400 flex items-center justify-center cursor-pointer relative overflow-hidden shadow-sm hover:bg-blue-50" title="自訂">
                    <span class="text-xs">🎨</span>
                    <input type="color" id="customStrokeInput" onchange="setStrokeColor(this.value)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                </label>
            </div>

            <!-- 框線粗細 -->
            <div class="text-sm font-bold text-gray-500 mb-1">📏 框線粗細</div>
            <div class="flex gap-1 mb-4">
                <button onclick="setStrokeWidth(0)"  id="sw-0"  class="flex-1 py-1.5 rounded-lg border-2 border-gray-200 bg-gray-50 font-bold text-gray-500 text-sm">無</button>
                <button onclick="setStrokeWidth(3)"  id="sw-3"  class="flex-1 py-1.5 rounded-lg border-2 border-gray-200 bg-gray-50 font-bold text-gray-600 text-sm">細</button>
                <button onclick="setStrokeWidth(6)"  id="sw-6"  class="flex-1 py-1.5 rounded-lg border-2 border-blue-400 bg-blue-50 font-bold text-blue-600 text-sm">中</button>
                <button onclick="setStrokeWidth(12)" id="sw-12" class="flex-1 py-1.5 rounded-lg border-2 border-gray-200 bg-gray-50 font-bold text-gray-600 text-sm">粗</button>
                <button onclick="setStrokeWidth(20)" id="sw-20" class="flex-1 py-1.5 rounded-lg border-2 border-gray-200 bg-gray-50 font-bold text-gray-600 text-sm">極</button>
            </div>

            <!-- 即時預覽 -->
            <div class="mb-5 bg-[#e5e5e5] rounded-xl overflow-hidden flex items-center justify-center relative shadow-inner" style="min-height:80px; background-image: linear-gradient(45deg, #d4d4d4 25%, transparent 25%), linear-gradient(-45deg, #d4d4d4 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #d4d4d4 75%), linear-gradient(-45deg, transparent 75%, #d4d4d4 75%); background-size: 10px 10px; background-position: 0 0, 0 5px, 5px -5px, -5px 0px;">
                <canvas id="textPreviewCanvas" width="280" height="80" style="display:block;max-width:100%;"></canvas>
            </div>

            <!-- 按鈕：上下排列 -->
            <button onclick="confirmAddText()" class="w-full py-3 mb-2 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold text-lg action-btn shadow-md transition-colors">確定加入</button>
            <button onclick="closeTextModal()" class="w-full py-3 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold text-gray-600 action-btn transition-colors">取消</button>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="alertModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[300] p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-6 shadow-2xl text-center w-full max-w-[280px] transform transition-transform">
            <div id="alertIcon" class="text-5xl mb-3">💬</div>
            <div id="alertMsg" class="text-lg font-bold text-gray-800 mb-6 leading-relaxed"></div>
            <button onclick="closeAlert()" class="w-full py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-bold text-lg action-btn transition-colors">我知道了</button>
        </div>
    </div>

    <!-- Processing Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 hidden flex-col items-center justify-center z-[400] text-white">
        <div class="w-16 h-16 border-4 border-white border-t-transparent rounded-full animate-spin mb-4 shadow-lg"></div>
        <div class="text-xl font-bold tracking-widest drop-shadow-md" id="loadingText">處理中...</div>
    </div>

    <script>
        // --- State ---
        let frames = [{ id: Date.now(), objects: [], duration: 400 }];
        let currentFrameIndex = 0;
        let selectedObjectIndex = -1;
        let isPreviewing = false;
        let previewInterval = null;
        let tempTextColor = "#EF4444";
        let tempStrokeColor = "#FFFFFF";
        let tempStrokeWidth = 6;
        let tempLineHeight = 1.4;

        // Canvas / Export Dimensions
        let canvasW = 370;
        let canvasH = 320;

        let isDragging = false, isResizing = false;
        let lastMousePos = { x: 0, y: 0 };
        let startAngle = 0, startScale = 1;

        let canvas, ctx;

        // 確保 DOM 完全載入後才初始化事件
        document.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('mainCanvas');
            ctx = canvas.getContext('2d');
            
            renderFrameList();
            draw();
            
            // Mouse Events
            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            
            // Touch Events (確保 passive: false 阻止預設捲動)
            canvas.addEventListener('touchstart', (e) => {
                if(e.touches.length === 1) onMouseDown(e.touches[0]);
            }, { passive: false });
            window.addEventListener('touchmove', (e) => { 
                if(isDragging || isResizing) {
                    e.preventDefault(); 
                    onMouseMove(e.touches[0]);
                }
            }, { passive: false });
            window.addEventListener('touchend', onMouseUp);

            document.getElementById('textInput').addEventListener('input', () => { 
                if(document.getElementById('textModal').style.display === 'flex') updateTextPreview(); 
            });

            // 監聽視窗大小改變，重繪UI控點
            window.addEventListener('resize', () => {
                if(!isPreviewing) draw();
            });
        });

        // --- Core Drawing ---
        function draw(targetCtx = ctx, frameIndex = currentFrameIndex, isExport = false) {
            if (!targetCtx) return;
            const currentCanvas = targetCtx.canvas;
            targetCtx.clearRect(0, 0, currentCanvas.width, currentCanvas.height);
            const frame = frames[frameIndex];
            if (!frame) return;

            frame.objects.forEach((obj, index) => {
                targetCtx.save();
                targetCtx.translate(obj.x, obj.y);
                targetCtx.rotate(obj.rotation * Math.PI / 180);
                targetCtx.scale(
                    obj.scale * (obj.flipH ? -1 : 1),
                    obj.scale * (obj.flipV ? -1 : 1)
                );

                let w = 80, h = 80;
                if (obj.type === 'image') { w = obj.w; h = obj.h; }

                if (obj.type === 'text' || obj.type === 'sticker') {
                    targetCtx.textAlign = "center";
                    targetCtx.textBaseline = "middle";
                    targetCtx.lineJoin = 'round';
                    if (obj.type === 'sticker') {
                        targetCtx.font = "60px Arial";
                        targetCtx.strokeStyle = "rgba(0,0,0,0.15)";
                        targetCtx.lineWidth = 2;
                        targetCtx.strokeText(obj.content, 0, 0);
                        targetCtx.fillStyle = obj.color || "black";
                        targetCtx.fillText(obj.content, 0, 0);
                    } else {
                        // multiline text
                        const fontSize = 40;
                        targetCtx.font = "bold " + fontSize + "px Noto Sans TC, sans-serif";
                        const lh = (obj.lineHeight || 1.4) * fontSize;
                        const lines = obj.content.split("\n");
                        const sw = (obj.strokeWidth !== undefined) ? obj.strokeWidth : 6;
                        const sc = obj.strokeColor || '#FFFFFF';
                        lines.forEach((line, li) => {
                            const ly = (li - (lines.length - 1) / 2) * lh;
                            if (sw > 0 && sc !== 'none') {
                                targetCtx.strokeStyle = sc;
                                targetCtx.lineWidth = sw;
                                targetCtx.strokeText(line, 0, ly);
                            }
                            targetCtx.fillStyle = obj.color || "black";
                            targetCtx.fillText(line, 0, ly);
                        });
                    }
                } else if (obj.type === 'image') {
                    targetCtx.drawImage(obj.img, -w/2, -h/2, w, h);
                }

                // 繪製 UI 控點 (僅在非預覽、非匯出、且被選中時)
                if (!isExport && index === selectedObjectIndex && !isPreviewing) {
                    targetCtx.restore(); 
                    targetCtx.save();
                    targetCtx.translate(obj.x, obj.y);
                    targetCtx.rotate(obj.rotation * Math.PI / 180);
                    
                    // 計算縮放率以適應不同螢幕大小
                    let dScale = 1;
                    const rect = targetCtx.canvas.getBoundingClientRect();
                    if(rect.width > 0) dScale = targetCtx.canvas.width / rect.width;

                    const halfW = (w / 2) * obj.scale + 10 * dScale;
                    const halfH = (h / 2) * obj.scale + 10 * dScale;
                    
                    // 外框
                    targetCtx.strokeStyle = "#3B82F6";
                    targetCtx.setLineDash([5 * dScale, 5 * dScale]);
                    targetCtx.lineWidth = 2 * dScale;
                    targetCtx.strokeRect(-halfW, -halfH, halfW * 2, halfH * 2);
                    targetCtx.setLineDash([]);
                    
                    // 旋轉縮放控制點 (右下角)
                    targetCtx.fillStyle = "white";
                    targetCtx.shadowBlur = 4 * dScale;
                    targetCtx.shadowColor = "rgba(0,0,0,0.4)";
                    targetCtx.beginPath();
                    targetCtx.arc(halfW, halfH, 18 * dScale, 0, Math.PI * 2);
                    targetCtx.fill();
                    
                    targetCtx.strokeStyle = "#3B82F6";
                    targetCtx.lineWidth = 2.5 * dScale;
                    targetCtx.stroke();
                    
                    targetCtx.fillStyle = "#3B82F6";
                    targetCtx.shadowBlur = 0;
                    targetCtx.font = `bold ${16 * dScale}px Arial`;
                    targetCtx.fillText("🔄", halfW, halfH);
                }
                targetCtx.restore();
            });
        }

        // --- Interaction & Scaling ---
        function getScale() {
            const rect = canvas.getBoundingClientRect();
            // 計算 CSS 尺寸與 Canvas 內部尺寸的比例
            const sw = rect.width > 0 ? canvas.width / rect.width : 1;
            const sh = rect.height > 0 ? canvas.height / rect.height : 1;
            return { scaleX: sw, scaleY: sh, rect };
        }

        function getBaseScale() {
            return Math.min(canvasW / 370, canvasH / 320);
        }

        function onMouseDown(e) {
            if (isPreviewing) return;
            const { scaleX, scaleY, rect } = getScale();
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            if (selectedObjectIndex !== -1) {
                const obj = frames[currentFrameIndex].objects[selectedObjectIndex];
                const w = obj.type === 'image' ? obj.w : 80, h = obj.type === 'image' ? obj.h : 80;
                
                const handleDistX = (w/2 * obj.scale + 10 * scaleX);
                const handleDistY = (h/2 * obj.scale + 10 * scaleY);
                const angleRad = obj.rotation * Math.PI / 180;
                
                const dx = x - obj.x, dy = y - obj.y;
                const localX = dx * Math.cos(-angleRad) - dy * Math.sin(-angleRad);
                const localY = dx * Math.sin(-angleRad) + dy * Math.cos(-angleRad);
                
                // 判斷是否點擊到控制點 (稍微放大感應區塊)
                if (Math.sqrt((localX - handleDistX)**2 + (localY - handleDistY)**2) < 40 * scaleX) {
                    isResizing = true;
                    startAngle = obj.rotation - Math.atan2(dy, dx) * 180 / Math.PI;
                    startScale = obj.scale / Math.max(1, Math.sqrt(dx*dx + dy*dy));
                    return;
                }
            }

            // 判斷是否點擊到物件
            let found = -1;
            for (let i = frames[currentFrameIndex].objects.length - 1; i >= 0; i--) {
                const o = frames[currentFrameIndex].objects[i];
                const boundSize = (o.type === 'image' ? Math.max(o.w, o.h) : 80);
                if (Math.sqrt((x - o.x)**2 + (y - o.y)**2) < (boundSize/2 * o.scale) + 15 * scaleX) { 
                    found = i; break; 
                }
            }
            
            selectedObjectIndex = found;
            updateUIState();
            if (found !== -1) { 
                isDragging = true; 
                lastMousePos = { x, y }; 
            }
            draw();
        }

        function onMouseMove(e) {
            if (isPreviewing || (!isDragging && !isResizing)) return;
            const { scaleX, scaleY, rect } = getScale();
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            const obj = frames[currentFrameIndex].objects[selectedObjectIndex];
            
            if (isDragging && obj) {
                obj.x += (x - lastMousePos.x); 
                obj.y += (y - lastMousePos.y);
                lastMousePos = { x, y }; 
                draw();
            } else if (isResizing && obj) {
                const dx = x - obj.x, dy = y - obj.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                obj.scale = Math.max(0.1, dist * startScale);
                obj.rotation = startAngle + Math.atan2(dy, dx) * 180 / Math.PI;
                draw();
            }
        }

        function onMouseUp() { 
            isDragging = false; 
            isResizing = false; 
        }

        function updateUIState() {
            const delBtn = document.getElementById('deleteBtn');
            const delText = document.getElementById('deleteBtnText');
            const flipBtns = document.getElementById('flipBtns');
            const hasObj = selectedObjectIndex !== -1;
            
            if (delBtn && delText) {
                delBtn.disabled = !hasObj;
                // 使用 add/remove 代替 replace，避免 class 狀態不一致報錯
                if(hasObj) {
                    delBtn.classList.remove('opacity-40');
                    delBtn.classList.add('opacity-100', 'hover:bg-red-50', 'hover:border-red-200');
                    delText.classList.remove('text-gray-600');
                    delText.classList.add('text-red-600');
                } else {
                    delBtn.classList.remove('opacity-100', 'hover:bg-red-50', 'hover:border-red-200');
                    delBtn.classList.add('opacity-40');
                    delText.classList.remove('text-red-600');
                    delText.classList.add('text-gray-600');
                }
            }

            if (flipBtns) {
                flipBtns.style.opacity = hasObj ? "1" : "0.4";
                flipBtns.style.pointerEvents = hasObj ? "auto" : "none";
            }
        }

        const SPEED_PRESETS = [
            { label: '慢', ms: 900 },
            { label: '中', ms: 400 },
            { label: '快', ms: 150 },
        ];
        function getSpeedLabel(ms) {
            if (ms >= 700) return '慢';
            if (ms <= 200) return '快';
            return '中';
        }

                dlBtn.innerHTML = '⬇️ 下載單張';

                card.appendChild(dlBtn);

                if (isActive) {
                    const copyBtn = document.createElement('button');

                    copyBtn.onclick = (e) => { e.stopPropagation(); duplicateFrame(index); };

            // Auto scroll to active frame

        function selectFrame(index) {
            currentFrameIndex = index; selectedObjectIndex = -1; updateUIState();
            renderFrameList(); draw();
        }

        function addFrame() { 
            frames.push({ id: Date.now(), objects: [], duration: 400 }); 
            selectFrame(frames.length - 1); 
        }

        function duplicateFrame(index) {
            const newObjs = JSON.parse(JSON.stringify(frames[index].objects));
            newObjs.forEach((o, i) => { if(o.type === 'image') o.img = frames[index].objects[i].img; });
            frames.splice(index + 1, 0, { id: Date.now(), objects: newObjs, duration: frames[index].duration || 400 });
            selectFrame(index + 1);
        }

        function deleteFrame(index) {
            if (frames.length <= 1) return;
            frames.splice(index, 1);
            currentFrameIndex = Math.max(0, currentFrameIndex - 1);
            selectFrame(currentFrameIndex);
        }

        // --- Canvas Size Setting Methods ---
        function openSizeModal() {
            document.getElementById('canvasWidthInput').value = canvasW;
            document.getElementById('canvasHeightInput').value = canvasH;
            document.getElementById('sizeModal').style.display = 'flex';
        }
        
        function closeSizeModal() {
            document.getElementById('sizeModal').style.display = 'none';
        }

        function useUploadedImageSize() {
            let foundImg = null;
            for(let f of frames) {
                for(let obj of f.objects) {
                    if(obj.type === 'image') {
                        foundImg = obj.img;
                        break;
                    }
                }
                if(foundImg) break;
            }
            
            if(foundImg) {
                document.getElementById('canvasWidthInput').value = foundImg.width;
                document.getElementById('canvasHeightInput').value = foundImg.height;
            } else {
                showAlert('目前畫面上沒有上傳的圖片喔！請先挑選圖片。', '⚠️');
            }
        }

        function confirmSizeChange() {
            let newW = parseInt(document.getElementById('canvasWidthInput').value);
            let newH = parseInt(document.getElementById('canvasHeightInput').value);
            
            if(isNaN(newW) || newW < 50) newW = 50;
            if(isNaN(newH) || newH < 50) newH = 50;
            if(newW > 2000) newW = 2000;
            if(newH > 2000) newH = 2000;

            if (newW > 1000 || newH > 1000) {
                showAlert('畫布尺寸過大，製作 GIF 時可能會較耗時，請耐心等候！', '💡');
            }

            const oldW = canvasW;
            const oldH = canvasH;
            canvasW = newW;
            canvasH = newH;

            // Update Canvas Dimensions
            canvas.width = canvasW;
            canvas.height = canvasH;
            document.getElementById('canvasBox').style.aspectRatio = `${canvasW} / ${canvasH}`;
            document.getElementById('canvasSizeDisplay').innerText = `${canvasW}x${canvasH}`;

            // 比例縮放現有物件，防跑版
            const scaleX = canvasW / oldW;
            const scaleY = canvasH / oldH;
            const scaleMin = Math.min(scaleX, scaleY);

            frames.forEach(frame => {
                frame.objects.forEach(obj => {
                    obj.x *= scaleX;
                    obj.y *= scaleY;
                    obj.scale *= scaleMin;
                });
            });

            closeSizeModal();
            draw();
        }

        // --- Sticker & Text Modals ---
        const STICKER_LIST = [
            '❤️','💛','💚','💙','💜','🤍','💕','💖',
            '🌟','✨','🔥','🎉','🎈','🎀','🎁','🌸',

        function setTextColor(color) {

        function setStrokeColor(color) {
            tempStrokeColor = color;
            const preview = document.getElementById('strokeColorPreview');

                preview.innerHTML = '<span class="text-gray-400 text-xs w-full h-full flex items-center justify-center">✕</span>'; 
            }

        function setStrokeWidth(w) {
            tempStrokeWidth = w;
            updateStrokeWidthUI();
            updateTextPreview();
        }
        function setLineHeight(v) {
            tempLineHeight = v;
            updateLineHeightUI();
            updateTextPreview();
        }
        function updateStrokeWidthUI() {
            [0,3,6,12,20].forEach(v => {
                const btn = document.getElementById('sw-' + v);
                if (!btn) return;
                const active = v === tempStrokeWidth;
                btn.className = `flex-1 py-1.5 rounded-lg border-2 font-bold text-sm transition-colors ${active ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 bg-gray-50 text-gray-600 hover:bg-gray-100'}`;
            });
        }
        function updateLineHeightUI() {
            [10,14,19,25].forEach(v => {
                const btn = document.getElementById('lh-' + v);
                if (!btn) return;
                const val = v / 10;
                const active = Math.abs(val - tempLineHeight) < 0.05;
                btn.className = `flex-1 py-1.5 rounded-lg border-2 font-bold text-sm transition-colors ${active ? 'border-blue-500 bg-blue-50 text-blue-700' : 'border-gray-200 bg-gray-50 text-gray-600 hover:bg-gray-100'}`;
            });
        }
        function updateTextPreview() {
            const cvs = document.getElementById('textPreviewCanvas');
            if (!cvs) return;
            const ctx = cvs.getContext('2d');
            const W = cvs.width, H = cvs.height;
            ctx.clearRect(0, 0, W, H);
            const rawText = document.getElementById('textInput').value || '預覽文字';
            const lines = rawText.split('\n');
            const fontSize = 28;
            ctx.font = 'bold ' + fontSize + 'px Noto Sans TC, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            const lh = tempLineHeight * fontSize;
            const totalH = lh * lines.length;
            const startY = H / 2 - (totalH - lh) / 2;
            lines.forEach((line, i) => {
                const y = startY + i * lh;
                if (tempStrokeWidth > 0 && tempStrokeColor !== 'none') {
                    ctx.strokeStyle = tempStrokeColor;
                    ctx.lineWidth = tempStrokeWidth * 0.6;
                    ctx.strokeText(line, W / 2, y);
                }
                ctx.fillStyle = tempTextColor;
                ctx.fillText(line, W / 2, y);
            });
        }
        function closeTextModal() { document.getElementById('textModal').style.display = 'none'; }
        
        function confirmAddText() {
            const val = document.getElementById('textInput').value;
            if (val.trim()) {
                frames[currentFrameIndex].objects.push({
                    type: 'text', content: val, 
                    x: canvasW / 2, y: canvasH / 2, 
                    scale: getBaseScale(), rotation: 0,
                    color: tempTextColor, strokeColor: tempStrokeColor,
                    strokeWidth: tempStrokeWidth, lineHeight: tempLineHeight
                });
                selectedObjectIndex = frames[currentFrameIndex].objects.length - 1; 
                updateUIState(); draw();
            }
            document.getElementById('textInput').value = ''; 
            closeTextModal();
        }

        function addSticker(emoji) {
            frames[currentFrameIndex].objects.push({ 
                type: 'sticker', content: emoji, 
                x: canvasW / 2, y: canvasH / 2, 
                scale: 1.5 * getBaseScale(), rotation: 0 
            });
            selectedObjectIndex = frames[currentFrameIndex].objects.length - 1; 
            updateUIState(); draw();
        }

        // --- 修復：圖片上傳處理邏輯加入防呆與錯誤追蹤 ---
        function handleFileUpload(event) {
            try {
                const file = event.target.files[0]; 
                if (!file) return;
                
                // 檢查是否為圖片檔案
                if (!file.type.startsWith('image/')) {
                    showAlert('請選擇有效的圖片檔案！', '⚠️');
                    event.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let ratio = 1;
                        if (img.width > canvasW || img.height > canvasH) {
                            ratio = Math.min(canvasW / img.width, canvasH / img.height);
                        }
                        
                        frames[currentFrameIndex].objects.push({ 
                            type: 'image', img, 
                            w: img.width * ratio, h: img.height * ratio, 
                            x: canvasW / 2, y: canvasH / 2, 
                            scale: 1, rotation: 0 
                        });
                        selectedObjectIndex = frames[currentFrameIndex].objects.length - 1; 
                        updateUIState(); draw();
                    };
                    img.onerror = () => {
                        showAlert('圖片載入失敗，可能檔案格式不受支援！', '❌');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            } catch (err) {
                console.error(err);
                showAlert('讀取圖片時發生異常！', '❌');
            } finally {
                // 清空 input，讓使用者能重複選取同一張圖片
                event.target.value = ''; 
            }
        }

        function flipSelected(dir) {
            if (selectedObjectIndex === -1) return;
            const obj = frames[currentFrameIndex].objects[selectedObjectIndex];
            if (dir === 'H') obj.flipH = !obj.flipH;
            else             obj.flipV = !obj.flipV;
            draw();
        }

        function deleteSelected() { 
            if (selectedObjectIndex === -1) return; 
            frames[currentFrameIndex].objects.splice(selectedObjectIndex, 1); 
            selectedObjectIndex = -1; updateUIState(); draw(); 
        }

        // --- Preview ---
        function previewAnimation() {
            const btn = document.getElementById('previewBtn');
            if (isPreviewing) {
                clearTimeout(previewInterval); isPreviewing = false;
                btn.innerHTML = "<span>▶️</span> <span>預覽播放</span>";
                btn.classList.replace('bg-gray-800', 'bg-white');
                btn.classList.replace('text-white', 'text-red-500');
                draw();
            } else {
                if (frames.length < 2) { showAlert('至少要兩個步驟喔！', '⚠️'); return; }
                isPreviewing = true; selectedObjectIndex = -1; updateUIState();
                btn.innerHTML = "<span>⏹️</span> <span>停止預覽</span>";
                btn.classList.replace('bg-white', 'bg-gray-800');
                btn.classList.replace('text-red-500', 'text-white');
                
                let pIndex = 0;
                function playNextFrame() {
                    if (!isPreviewing) return;
                    currentFrameIndex = pIndex; draw(); renderFrameList();
                    const delay = frames[pIndex].duration || 400;
                    pIndex = (pIndex + 1) % frames.length;
                    previewInterval = setTimeout(playNextFrame, delay);
                }
                playNextFrame();
            }
        }

        // --- Download Outputs ---
        function downloadFramePNG(index) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = canvasW;
            offCanvas.height = canvasH;
            const offCtx = offCanvas.getContext('2d');
            draw(offCtx, index, true);
            offCanvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `frame_${index + 1}_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/png');
        }

        // --- 修復：解決 GitHub Pages 上匯出 GIF 的 CORS Worker 限制 ---
        async function exportGIF() {
            if (frames.length < 2) { showAlert('請至少製作 2 個步驟再儲存喔！', '⚠️'); return; }
            if (isPreviewing) previewAnimation(); // Stop preview if running

            const overlay = document.getElementById('loadingOverlay');
            overlay.style.display = 'flex';
            document.getElementById('loadingText').innerText = '正在準備引擎資源...';
            
            await new Promise(r => setTimeout(r, 50));
            let workerUrl = null;

            try {
                // 將 Worker 轉換成 Blob 網址，繞開跨網域限制
                const workerRes = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
                if (!workerRes.ok) throw new Error("無法取得 GIF 引擎。");
                const workerBlob = await workerRes.blob();
                workerUrl = URL.createObjectURL(workerBlob);

                document.getElementById('loadingText').innerText = '正在製作 GIF，請稍候...';
                await new Promise(r => setTimeout(r, 50));

                const W = canvasW, H = canvasH;
                const TRANSPARENT_KEY = 0x00FE00;

                const offCanvas = document.createElement('canvas');
                offCanvas.width = W; offCanvas.height = H;
                const offCtx = offCanvas.getContext('2d');

                const keyCanvas = document.createElement('canvas');
                keyCanvas.width = W; keyCanvas.height = H;
                const keyCtx = keyCanvas.getContext('2d');

                const gif = new GIF({
                    workers: 2,
                    quality: 10,
                    width: W,
                    height: H,
                    transparent: TRANSPARENT_KEY,
                    background: TRANSPARENT_KEY,
                    workerScript: workerUrl
                });

                for (let i = 0; i < frames.length; i++) {
                    offCtx.clearRect(0, 0, W, H);
                    draw(offCtx, i, true);

                    const imgData = offCtx.getImageData(0, 0, W, H);
                    const d = imgData.data;
                    for (let p = 0; p < d.length; p += 4) {
                        if (d[p + 3] < 10) {
                            d[p]     = (TRANSPARENT_KEY >> 16) & 0xFF; // R = 0
                            d[p + 1] = (TRANSPARENT_KEY >> 8)  & 0xFF; // G = 254
                            d[p + 2] =  TRANSPARENT_KEY        & 0xFF; // B = 0
                            d[p + 3] = 255;
                        }
                    }
                    keyCtx.putImageData(imgData, 0, 0);
                    gif.addFrame(keyCtx, { delay: frames[i].duration || 400, copy: true });
                }

                const blob = await new Promise((resolve, reject) => { 
                    gif.on('finished', b => resolve(b)); 
                    gif.on('abort', () => reject(new Error('GIF generation aborted')));
                    gif.render(); 
                });

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `sticker_${canvasW}x${canvasH}_${Date.now()}.gif`;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
                
                showAlert('GIF 製作完成！\n已開始下載', '🎉');
            } catch(err) {
                console.error(err); 
                showAlert('製作過程中發生錯誤，\n請再試一次。', '😢');
            } finally {
                if (workerUrl) URL.revokeObjectURL(workerUrl);
                overlay.style.display = 'none';
            }
        }

        // --- Alert System ---
        function showAlert(msg, icon) {
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('alertIcon').innerText = icon || '💬';
            document.getElementById('alertModal').style.display = 'flex';
        }
        function closeAlert() {
            document.getElementById('alertModal').style.display = 'none';
        }
    </script>
</body>
</html>
